
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fotogram</title>

    <link rel="icon" type="image/svg+xml" href="./assets/icons/fav.svg">
    <link rel="stylesheet" href="./css/font.css">
    <link rel="stylesheet" href="./css/variables.css">
    <link rel="stylesheet" href="./style.css">
    <script src="./main.js" defer></script>
</head>

<body>
    <header class="header">
        <div class="header_container">
            <img src="./assets/icons/hp-logo.svg" alt="HP Logo">
        </div>
    </header>

    <main class="main">
        <section class="hero">
            <h1>Your personal photo album</h1>
        </section>

        <section class="gallery">
            <div class="gallery_grid"></div>
        </section>
    </main>

    <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-labelledby="lightboxTitle" aria-hidden="true" tabindex="-1">

        <div class="lightbox_content" id="lightboxContent"></div>
    </div>

    <footer class="footer">
        <div class="footer_container">
            <img src="./assets/icons/DA-Logo.png" alt="DA Logo">
            <p>&copy; 2026 Alexander Jahn</p>
        </div>
    </footer>
</body>

</html>
